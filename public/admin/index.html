<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#2b1740" />
  <title>Card Studio · {{NAME}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css?v={{V}}" />
</head>
<body>
  <!-- Login -->
  <section class="login" id="login" hidden>
    <form class="login__card" id="loginForm">
      <div class="login__emoji">🎂</div>
      <h1>Card Studio</h1>
      <p>Edit {{NAME}}'s birthday card</p>
      <input type="password" id="password" placeholder="Admin password" autocomplete="current-password" required />
      <button class="btn btn--primary" type="submit">Log in</button>
      <p class="login__err" id="loginErr" aria-live="polite"></p>
    </form>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="topbar__brand">🎂 <span>Card Studio</span></div>
      <div class="topbar__actions">
        <a class="btn btn--ghost" href="/" target="_blank" rel="noopener">View card ↗</a>
        <button class="btn btn--ghost" id="logoutBtn">Log out</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="general" aria-selected="true">✨ General</button>
      <button role="tab" data-tab="photos">📸 Photos</button>
      <button role="tab" data-tab="memes">🤡 Memes</button>
      <button role="tab" data-tab="letter">💌 Letter</button>
      <button role="tab" data-tab="plan">🗓️ Plan</button>
      <button role="tab" data-tab="rsvp">💚 RSVP</button>
      <button role="tab" data-tab="music">🎵 Music</button>
    </nav>

    <main class="panels" id="panels"></main>

    <div class="savebar" id="savebar">
      <span class="savebar__status" id="saveStatus">All changes saved</span>
      <button class="btn btn--primary" id="saveBtn" disabled>Save changes</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/admin.js?v={{V}}"></script>
</body>
</html>
